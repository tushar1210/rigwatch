version: "2"

run:
  timeout: 5m

linters:
  default: standard
  disable:
    - depguard
    - exhaustruct
    - wrapcheck
    - varnamelen
    - nlreturn
    - wsl
    - godot
    - godox
    - testpackage
    - paralleltest
    - tparallel
    - gochecknoglobals
    - gochecknoinits
    - forbidigo
    - mnd
    - funlen
    - gocognit
    - cyclop
    - nestif
    - lll
    - dupl
    - goconst
    - tagliatelle
    - gomoddirectives

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
